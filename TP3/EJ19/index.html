<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 19 - Formulario Multi-step</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Formulario de registro</h1>

        <form>
            <!-- Controles de los pasos -->
            <input type="radio" name="paso" id="paso1" checked>
            <input type="radio" name="paso" id="paso2">

            <!-- Paso 1 -->
            <section class="seccion paso-1">
                <h2>Paso 1: Datos personales</h2>

                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        minlength="3"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <label for="paso2" class="boton">Siguiente</label>
            </section>

            <!-- Paso 2 -->
            <section class="seccion paso-2">
                <h2>Paso 2: Crear contraseña</h2>

                <div class="campo">
                    <label for="usuario">Usuario:</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        minlength="4"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="acciones">
                    <label for="paso1" class="boton">Anterior</label>
                    <button type="submit">Registrarse</button>
                </div>
            </section>
        </form>
    </main>
</body>
</html>
