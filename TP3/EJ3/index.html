<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario semanal de clases</title>
</head>

<body>
    <main>
        <h1>Horario semanal de clases</h1>

        <table border="1">
            <thead>
                <tr>
                    <th>Horario</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <th>08:00 - 10:00</th>
                    <td>AyED</td>
                    <td>Matemática discreta</td>
                    <td rowspan="2">UX/UI</td>
                    <td>Base de Datos</td>
                    <td>Ing. Software</td>
                </tr>

                <tr>
                    <th>10:00 - 12:00</th>
                    <td>Base de Datos</td>
                    <td>UX/UI</td>
                    <td>Analisis matemático</td>
                    <td>Inglés</td>
                </tr>

                <tr>
                    <th>14:00 - 16:00</th>
                    <td colspan="2">Laboratorio de Programación</td>
                    <td>Inglés</td>
                    <td>POO</td>
                    <td>Base de Datos</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="6">Horario semanal de clases</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>
</html>
