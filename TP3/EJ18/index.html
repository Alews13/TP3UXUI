<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - Galería Mosaico</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Galería de imágenes</h1>

        <section class="galeria">
            <div class="imagen grande">
                <img src="img/imagen1.jpg" alt="Paisaje de montaña">
            </div>

            <div class="imagen">
                <img src="img/imagen2.jpg" alt="Paisaje de bosque">
            </div>

            <div class="imagen alta">
                <img src="img/imagen3.jpg" alt="Paisaje de lago">
            </div>

            <div class="imagen">
                <img src="img/imagen4.jpg" alt="Paisaje de playa">
            </div>

            <div class="imagen ancha">
                <img src="img/imagen5.jpg" alt="Paisaje de campo">
            </div>

            </div>
        </section>
    </main>
</body>
</html>
