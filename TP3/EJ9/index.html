<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería de productos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>Galería de productos</h1>

        <section class="galeria">

            <article class="card">
                <img src="producto1.jpg" alt="Producto 1">
                <h2>Producto 1</h2>
                <p>$15.000</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="producto2.jpg" alt="Producto 2">
                <h2>Producto 2</h2>
                <p>$20.000</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="producto3.jpg" alt="Producto 3">
                <h2>Producto 3</h2>
                <p>$25.000</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="producto4.jpg" alt="Producto 4">
                <h2>Producto 4</h2>
                <p>$30.000</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="producto5.jpg" alt="Producto 5">
                <h2>Producto 5</h2>
                <p>$35.000</p>
                <button type="button">Comprar</button>
            </article>

            <article class="card">
                <img src="producto6.jpg" alt="Producto 6">
                <h2>Producto 6</h2>
                <p>$40.000</p>
                <button type="button">Comprar</button>
            </article>

        </section>
    </main>
</body>
</html>
