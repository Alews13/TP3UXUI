<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Selectores CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 id="titulo">Ejemplo de selectores CSS</h1>

    <div class="card">
        <p>Este párrafo está dentro de la primera tarjeta.</p>
        <span>Información adicional</span>
    </div>

    <div class="card">
        <p>Este párrafo está dentro de la segunda tarjeta.</p>
        <span>Más información</span>
    </div>

    <div>
        <p>Este párrafo está fuera de las tarjetas.</p>
        <span class="destacado">Texto destacado</span>
    </div>
</body>
</html>
